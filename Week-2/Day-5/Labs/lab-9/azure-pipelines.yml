trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  imageName: manufacturing-iot-etl

stages:
  - stage: BuildTest
    displayName: Build and test Python ETL
    jobs:
      - job: PythonCI
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"
          - script: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: Install dependencies
          - script: flake8 .
            displayName: Lint with flake8
          - script: pytest --cov=.
            displayName: Run pytest with coverage

  - stage: Docker
    displayName: Build container image
    dependsOn: BuildTest
    jobs:
      - job: DockerBuild
        steps:
          - task: Docker@2
            inputs:
              command: build
              Dockerfile: Dockerfile
              tags: |
                $(imageName):$(Build.BuildId)

  - stage: DeployK8s
    displayName: Deploy to Kubernetes
    dependsOn: Docker
    jobs:
      - deployment: K8sDeploy
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "kubectl apply -f k8s/ (configure service connection)"
                  displayName: Kubernetes deployment placeholder
